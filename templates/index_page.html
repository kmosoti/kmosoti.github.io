{% extends "base.html" %}
{% from "components.html" import page_card %}

{% block content %}
  <section class="page-hero">
    <div class="section-shell">
      <p class="eyebrow">{{ eyebrow }}</p>
      <h1>{{ heading }}</h1>
      <p class="hero-lede">{{ intro }}</p>
    </div>
  </section>

  <section class="section-shell notebook-tools" aria-label="Notebook controls">
    <div class="filter-panel">
      <label for="notebook-search">Search notebook</label>
      <input id="notebook-search" type="search" placeholder="Search title, tag, or summary" data-notebook-search>
      <div class="filter-row" aria-label="Type filters">
        <button class="filter-button active" type="button" data-filter-type="all">All</button>
        <button class="filter-button" type="button" data-filter-type="doctrine">Doctrine</button>
        <button class="filter-button" type="button" data-filter-type="field-note">Field Notes</button>
        <button class="filter-button" type="button" data-filter-type="lab">Labs</button>
        <button class="filter-button" type="button" data-filter-type="diagram">Diagrams</button>
        <button class="filter-button" type="button" data-filter-type="experiment">Experiments</button>
      </div>
    </div>

    <div class="notebook-grid" data-card-grid>
      {% for page in page_set %}
        {{ page_card(page) }}
      {% endfor %}
    </div>
  </section>
{% endblock %}
