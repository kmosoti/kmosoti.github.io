{% macro status_badge(status) -%}
  <span class="status-pill">{{ status_label(status) }}</span>
{%- endmacro %}

{% macro page_card(page) -%}
  <article class="notebook-card" data-card data-type="{{ page.page_type }}" data-tags="{{ page.tags | join(' ') }}" data-title="{{ page.title | lower }}">
    <div class="card-topline">
      <span class="card-index">{{ page.meta.type }}</span>
      {{ status_badge(page.status) }}
    </div>
    <h3><a href="{{ page.url }}">{{ page.title }}</a></h3>
    <p>{{ page.summary }}</p>
    <div class="tag-row" aria-label="Tags">
      {% for tag in page.tags %}
        <span>{{ tag }}</span>
      {% endfor %}
    </div>
  </article>
{%- endmacro %}
